name: Sync docs to GitHub Wiki

on:
  push:
    paths:
      - "docs/**/*.md"
      - ".github/workflows/sync-wiki.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Clone wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [ -z "$WIKI_TOKEN" ]; then
            echo "Missing WIKI_TOKEN secret. Add a token that can write to this repository's wiki." >&2
            exit 1
          fi
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$WIKI_TOKEN" | base64 -w0)"
          git -c "http.extraheader=$auth_header" clone "https://github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"

      - name: Copy documentation pages
        run: |
          cp docs/*.md "$RUNNER_TEMP/wiki/"
          {
            echo "# Documentation"
            echo
            for file in docs/*.md; do
              page="$(basename "$file" .md)"
              printf -- '- [%s](%s)\n' "$page" "$page"
            done
          } > "$RUNNER_TEMP/wiki/Home.md"

      - name: Publish wiki updates
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/wiki"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.md'
          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$WIKI_TOKEN" | base64 -w0)"
          git -c "http.extraheader=$auth_header" commit -m "Sync documentation from docs/"
          git -c "http.extraheader=$auth_header" push origin HEAD
