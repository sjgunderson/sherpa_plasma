[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sherpa_plasma"
version = "0.1.0"
description = "Independent local AtomDB access and plasma-model inspection tools"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
plasma = ["pyatomdb>=1.0.0,<2", "astropy>=5"]
test = ["pytest>=7", "pyatomdb>=1.0.0,<2", "astropy>=5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sherpa_plasma*"]

[tool.setuptools.package-data]
sherpa_plasma = ["*.cpp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
